<div id="div-form">
    <h2>Cadastro atleta</h2>

    <form id="form-atleta" (ngSubmit)="enviaDadosAtleta()">

        <label for="nome">nome</label>
        <input type="text" name="nome" [(ngModel)] = "nome" id="nome" class="input01" required maxlength="80" placeholder="informe seu nome">

        <label for="nome">CPF</label>
        <input type="text" name="cpf" [(ngModel)] = "cpf" id="cp" class="input02" required maxlength="11" placeholder="informe seu cpf">

        <label for="data_nascimento">data de nacimento</label>
        <input type="date" name="data_nascimento" [(ngModel)] = "data_nascimento" id="data_nascimento" class="input02">
       
        <label for="altura">altura</label>
        <input type="text" name="altura" [(ngModel)] = "altura" id="altura" class="input02">

        <label for="peso">peso</label>
        <input type="text" name="peso" [(ngModel)] = "peso" id="peso" class="input02">

        <label for="sexo">sexo</label>
        <input type="radio" name="sexo" id="sexoM" class="btnSelecao" value="M" [(ngModel)] = "sexo"> Masculino
        <input type="radio" name="sexo" id="sexoF" class="btnSelecao" value="F" [(ngModel)] = "sexo"> Feminino
        <input type="radio" name="sexo" id="sexoN" class="btnSelecao" value="N" [(ngModel)] = "sexo"> Não se identificar

        <label for="cep">CEP</label>
        <input type="text" name="cep" [(ngModel)] = "cep" id="cep" class="input02" required maxlength="9" placeholder="informe seu CEP">

        <label for="rua-logradouro">Rua/logradouro</label>
        <input type="text" name="rua-logradouro" [(ngModel)] = "ruaLogradouro" id="rua-logradouro" class="input01" required maxlength="100" placeholder="informe rua/logradouro">

        <label for="bairro">bairro</label>
        <input type="text" name="bairro" [(ngModel)] = "bairro" id="bairro" class="input02" required maxlength="20" placeholder="informe o seu bairro">

        <label for="cidade">Cidade</label>
        <input type="text" name="cidade" [(ngModel)] = "cidade"  id="cidade" class="input02" required maxlength="60" placeholder="informe seu cidade">

        <label for="uf">UF</label>
        <input type="text" name="uf" [(ngModel)] = "uf" id="uf" class="input02" required maxlength="2" placeholder="informe seu uf">

        <div id="div-btns">
            <button type="submit" id="btnAdd" (click)="exibeDados()"> Cadastrar Atleta</button>
            <button type="reset" id="btnLimpar"> Cadastrar Atleta</button>
        </div>

    </form>
</div>
