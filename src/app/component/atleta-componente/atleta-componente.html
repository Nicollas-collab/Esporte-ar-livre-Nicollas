<div id="div-form">
    <h2>Cadastro atleta</h2>

    <form action="form-atleta">

        <label for="nome">nome</label>
        <input type="text" name="nome" id="nome" class="input01" required maxlength="80" placeholder="informe seu nome">

        <label for="nome">CPF</label>
        <input type="text" name="cpf" id="cp" class="input02" required maxlength="80" placeholder="informe seu cpf">

        <label for="sexo">sexo</label>
        <input type="radio" name="sexo" id="sexoM" class="btnSelecao" value="M"> Masculino
        <input type="radio" name="sexo" id="sexoF" class="btnSelecao" value="F"> Feminino
        <input type="radio" name="sexo" id="sexoN" class="btnSelecao" value="N"> Não se identificar

        <label for="cep">CEP</label>
        <input type="text" name="cep" id="cep" class="input02" required maxlength="9" placeholder="informe seu CEP">

        <label for="rua-logradouro">Rua/logradouro</label>
        <input type="text" name="rua-logradouro" id="rua-logradouro" class="input01" required maxlength="9" placeholder="informe rua/logradouro">

        <label for="cidade">Cidade</label>
        <input type="text" name="cidade" id="cidade" class="input02" required maxlength="60" placeholder="informe seu cidade">

        <label for="uf">UF</label>
        <input type="text" name="uf" id="uf" class="input02" required maxlength="2" placeholder="informe seu uf">

        <div id="div-btns">
            <button type="submit" id="btnAdd"> Cadastrar Atleta</button>
            <button type="reset" id="btnLimpar"> Cadastrar Atleta</button>
        </div>

    </form>
</div>
